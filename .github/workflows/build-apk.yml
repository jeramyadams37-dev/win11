name: Build Win11 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Maven Central Mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirrors.gradle << 'GRADLE'
          allprojects {
            buildscript {
              repositories {
                maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
                google()
                mavenCentral()
              }
            }
            repositories {
              maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
              google()
              mavenCentral()
            }
          }
          GRADLE

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/aurora-win11.keystore

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: /tmp/aurora-win11.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            ./gradlew assembleRelease --max-workers=2 && break
            echo "Gradle attempt $attempt failed, retrying in 15s..."
            sleep 15
          done

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: win11-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish Signed APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Win11 Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
