name: Build AuroraOS Win11 APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Package Web Assets & Bridge
        run: |
          mkdir -p build_output
          tar -czf build_output/AuroraOS_Win11_Bundle.tar.gz index.html hive_comms.js cortex_bridge.py
          echo "Build bundle generated successfully."

      - name: Upload APK / Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraOS-Win11-Release
          path: build_output/
